spring.application.name=version1

spring.mvc.apiversion.use.path=true

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=mhariyan
spring.datasource.password=marketing@1109
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable Java 21 Virtual Threads
#spring.threads.virtual.enabled=true

## Expose all actuator web endpoints (health, metrics, env, etc.)
#management.endpoints.web.exposure.include=*

# Show detailed health info including database connection status
management.info.env.enabled=true
management.endpoint.health.show-details=always

# =====================================================================
# 1. PRIMARY CHAT ROUTING (Directs to Groq LPU Hardware)
# =====================================================================
# Syntax: ${VARIABLE:fallback_value}
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL:llama3-8b-8192}
spring.ai.openai.chat.options.temperature=0.7

# =====================================================================
# 2. EMBEDDING OVERRIDES (Isolates Traffic to Jina Free Cloud API)
# =====================================================================
spring.ai.openai.embedding.api-key=${JINA_API_KEY}
spring.ai.openai.embedding.base-url=${JINA_BASE_URL:https://api.jina.ai}
spring.ai.openai.embedding.options.model=${JINA_EMBEDDING_MODEL:jina-embeddings-v5-text-small}